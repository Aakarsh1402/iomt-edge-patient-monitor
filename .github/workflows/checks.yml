name: checks

on:
  push:
  pull_request:

jobs:
  run-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install tensorflow-cpu
          sed -e 's/^tensorflow>=.*/# tensorflow (cpu build installed above)/' \
              -e 's/^torch>=.*/# torch (installed above)/' -e 's/^torchvision>=.*/# torchvision (installed above)/' \
              -e 's/^opencv-python>=/opencv-python-headless>=/' requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt
      - name: Run every check
        run: python run_checks.py --verbose
